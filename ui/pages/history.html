<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Geçmiş</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #2c2c2c;
            color: #e8eaed;
            min-height: 100vh;
            padding: 40px 0;
        }

        .page-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #e8eaed;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: gray;
            font-size: 26px;
        }

        .clear-btn {
            padding: 8px 16px;
            background: rgba(242, 139, 130, 0.1);
            color: #f28b82;
            border: 1px solid rgba(242, 139, 130, 0.2);
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .clear-btn:hover {
            background: rgba(242, 139, 130, 0.2);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #3b3b3b;
            border: 1px solid #444444;
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 24px;
        }

        .search-bar i {
            color: gray;
            font-size: 16px;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e8eaed;
            font-size: 14px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: gray;
        }

        .history-group {
            margin-bottom: 28px;
        }

        .group-label {
            font-size: 11px;
            font-weight: 600;
            color: gray;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .history-item img {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .history-item-icon {
            width: 16px;
            height: 16px;
            font-size: 14px;
            color: gray;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-item-info {
            flex: 1;
            min-width: 0;
        }

        .history-item-title {
            font-size: 13px;
            color: #e8eaed;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item-url {
            font-size: 11px;
            color: gray;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 2px;
        }

        .history-item-time {
            font-size: 11px;
            color: gray;
            flex-shrink: 0;
        }

        .history-item-del {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: gray;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s, background 0.15s, color 0.15s;
        }

        .history-item:hover .history-item-del {
            opacity: 1;
        }

        .history-item-del:hover {
            background: rgba(242, 139, 130, 0.15);
            color: #f28b82;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: gray;
        }

        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            color: #3c4043;
        }

        .empty-state p {
            font-size: 14px;
        }

        .visit-count {
            font-size: 11px;
            color: #a78bfa;
            background: rgba(167, 139, 250, 0.1);
            padding: 2px 7px;
            border-radius: 10px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="page-header">
            <div class="page-title">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span data-translate="history">Geçmiş</span>
            </div>
            <button class="clear-btn" id="clearAllBtn">
                <i class="fa-solid fa-trash-can"></i> <span data-translate="clear_all_history">Tümünü Temizle</span>
            </button>
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" data-translate-placeholder="history_search_placeholder"
                placeholder="Geçmişte ara...">
        </div>
        <div id="historyList"></div>
    </div>
    <script src="../translations.js"></script>
    <script>
        let visitedTabs = [];
        let siteVisitCounts = {};
        let searchHistory = [];

        function load() {
            try {
                const storedVisited = localStorage.getItem('xenixa_visited_tabs');
                if (storedVisited) {
                    visitedTabs = JSON.parse(storedVisited);
                }
            } catch (e) {
                console.error("Ziyaret edilen sekmeler geçmişi yüklenemedi:", e);
            }
            try {
                const storedCounts = localStorage.getItem('xenixa_visit_counts');
                if (storedCounts) {
                    siteVisitCounts = JSON.parse(storedCounts);
                }
            } catch (e) {
                console.error("Ziyaret sayaçları yüklenemedi:", e);
            }
            try {
                const storedHistory = localStorage.getItem('xenixa_history');
                if (storedHistory) {
                    searchHistory = JSON.parse(storedHistory);
                }
            } catch (e) {
                console.error("Arama geçmişi yüklenemedi:", e);
            }
        }

        function getDateGroupLabel(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date();
            yesterday.setDate(today.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return window.XenixaI18n.t('today');
            } else if (date.toDateString() === yesterday.toDateString()) {
                return window.XenixaI18n.t('yesterday');
            } else {
                const locale = window.XenixaI18n.currentLang === 'tr' ? 'tr-TR' : window.XenixaI18n.currentLang === 'ru' ? 'ru-RU' : 'en-US';
                return date.toLocaleDateString(locale, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function render(filter = '') {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            let items = visitedTabs.map(t => ({
                title: t.title || t.url,
                url: t.url,
                favicon: t.favicon || null,
                count: siteVisitCounts[t.url] || 1,
                date: t.date || Date.now(),
            }));

            if (filter) {
                const q = filter.toLowerCase();
                items = items.filter(i => i.title.toLowerCase().includes(q) || i.url.toLowerCase().includes(q));
            }

            if (items.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i><p>${window.XenixaI18n.t('no_history')}</p></div>`;
                return;
            }

            // Tarihe göre gruplandır
            const groups = {};
            items.forEach(item => {
                const label = getDateGroupLabel(item.date);
                if (!groups[label]) groups[label] = [];
                groups[label].push(item);
            });

            Object.entries(groups).forEach(([label, groupItems]) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'history-group';

                const labelDiv = document.createElement('div');
                labelDiv.className = 'group-label';
                labelDiv.textContent = label;
                groupDiv.appendChild(labelDiv);

                groupItems.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'history-item';

                    const faviconHtml = item.favicon
                        ? `<img src="${item.favicon}" alt="" onerror="this.style.display='none'">`
                        : `<div class="history-item-icon"><i class="fa-solid fa-globe"></i></div>`;

                    const locale = window.XenixaI18n.currentLang === 'tr' ? 'tr-TR' : window.XenixaI18n.currentLang === 'ru' ? 'ru-RU' : 'en-US';
                    const itemTime = new Date(item.date).toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
                    const visitsText = window.XenixaI18n.t('visits_count', { count: item.count });

                    el.innerHTML = `
                        ${faviconHtml}
                        <div class="history-item-info">
                            <div class="history-item-title">${escapeHtml(item.title)}</div>
                            <div class="history-item-url">${escapeHtml(item.url)}</div>
                        </div>
                        <span class="visit-count" style="margin-right: 8px;">${visitsText}</span>
                        <span class="history-item-time">${itemTime}</span>
                        <button class="history-item-del" title="${window.XenixaI18n.t('delete')}"><i class="fa-solid fa-xmark"></i></button>
                    `;

                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.history-item-del')) return;
                        const { ipcRenderer } = require('electron');
                        ipcRenderer.send('open-url-in-active-tab', item.url);
                    });

                    el.querySelector('.history-item-del').addEventListener('click', (e) => {
                        e.stopPropagation();
                        visitedTabs = visitedTabs.filter(t => t.url !== item.url);
                        delete siteVisitCounts[item.url];
                        const { ipcRenderer } = require('electron');
                        ipcRenderer.send('history-delete-item', { url: item.url });
                        render(document.getElementById('searchInput').value);
                    });

                    groupDiv.appendChild(el);
                });

                list.appendChild(groupDiv);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            render(e.target.value);
        });

        document.getElementById('clearAllBtn').addEventListener('click', () => {
            visitedTabs = [];
            siteVisitCounts = {};
            searchHistory = [];
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('history-clear-all');
            render();
        });

        load();
        render();
    </script>
</body>

</html>
