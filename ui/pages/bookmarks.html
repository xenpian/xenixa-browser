<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="bookmarks_title">Yer İşaretleri</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #2c2c2c;
            color: #e8eaed;
            min-height: 100vh;
            padding: 40px 0;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .page-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #e8eaed;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title i {
            color: gray;
            font-size: 26px;
        }

        .add-bookmark {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            padding: 0;
            margin-bottom: 24px;
        }

        .add-bookmark input {
            flex: 1;
            background: #3b3b3b;
            border: 1px solid #444444;
            border-radius: 12px;
            padding: 10px 16px;
            color: #e8eaed;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .add-bookmark input::placeholder {
            color: gray;
        }

        .add-bookmark input:focus {
            border-color: #a78bfa;
        }

        .add-bookmark button {
            padding: 10px 20px;
            background: rgba(167, 139, 250, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-bookmark button:hover {
            background: rgba(167, 139, 250, 0.25);
            border-color: rgba(167, 139, 250, 0.4);
        }

        .bookmarks-list {
            display: grid;
            gap: 4px;
        }

        .bookmark-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.1s;
            background: transparent;
            border: none;
        }

        .bookmark-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .bookmark-favicon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bookmark-favicon img {
            width: 16px;
            height: 16px;
        }

        .bookmark-favicon i {
            font-size: 14px;
            color: gray;
        }

        .bookmark-info {
            flex: 1;
            min-width: 0;
        }

        .bookmark-title {
            font-size: 13px;
            color: #e8eaed;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-url {
            font-size: 11px;
            color: gray;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 2px;
        }

        .bookmark-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .bookmark-action-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: gray;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.15s, background 0.15s, color 0.15s;
        }

        .bookmark-item:hover .bookmark-action-btn {
            opacity: 1;
        }

        .bookmark-action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #e8eaed;
        }

        .bookmark-action-btn.del-btn:hover {
            background: rgba(242, 139, 130, 0.15);
            color: #f28b82;
        }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: gray;
        }

        .empty-state i {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            color: #3c4043;
        }

        .empty-state p {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="page-header">
            <div class="page-title">
                <i class="fa-solid fa-bookmark"></i>
                <span data-translate="bookmarks_title">Yer İşaretleri</span>
            </div>
        </div>

        <div class="add-bookmark">
            <input type="text" id="bookmarkUrl" data-translate-placeholder="add_bookmark_placeholder"
                placeholder="URL girin...">
            <button onclick="addBookmark()" data-translate="add_bookmark_btn">Ekle</button>
        </div>

        <div class="bookmarks-list" id="bookmarksList"></div>
    </div>
    <script src="../translations.js"></script>

    <script>
        let bookmarks = [];

        function loadBookmarks() {
            try {
                const stored = localStorage.getItem('xenixa_bookmarks');
                if (stored) {
                    bookmarks = JSON.parse(stored);
                } else {
                    bookmarks = [];
                }
            } catch (e) {
                console.error('Failed to load bookmarks:', e);
                bookmarks = [];
            }
            renderBookmarks();
        }

        function renderBookmarks() {
            const list = document.getElementById('bookmarksList');
            if (!bookmarks || bookmarks.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-bookmark"></i>
                        <p>${window.XenixaI18n.t('no_bookmarks')}</p>
                    </div>
                `;
                return;
            }

            const openText = window.XenixaI18n.t('open');
            const deleteText = window.XenixaI18n.t('delete');

            list.innerHTML = bookmarks.map(bookmark => {
                let hostname = '';
                try {
                    hostname = new URL(bookmark.url).hostname;
                } catch (e) { }

                return `
                    <div class="bookmark-item" onclick="openBookmark('${escapeHtml(bookmark.url)}')">
                        <div class="bookmark-favicon">
                            ${hostname ? `<img src="https://www.google.com/s2/favicons?domain=${hostname}" alt="" onerror="this.style.display='none'">` : ''}
                            <i class="fa-solid fa-bookmark" style="display:${hostname ? 'none' : 'block'}"></i>
                        </div>
                        <div class="bookmark-info">
                            <div class="bookmark-title">${escapeHtml(bookmark.title || bookmark.url)}</div>
                            <div class="bookmark-url">${escapeHtml(bookmark.url)}</div>
                        </div>
                        <div class="bookmark-actions">
                            <button class="bookmark-action-btn" onclick="event.stopPropagation(); openBookmark('${escapeHtml(bookmark.url)}')" title="${openText}">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </button>
                            <button class="bookmark-action-btn del-btn" onclick="event.stopPropagation(); deleteBookmark('${bookmark.id}')" title="${deleteText}">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addBookmark() {
            const urlInput = document.getElementById('bookmarkUrl');
            const url = urlInput.value.trim();
            if (!url) return;

            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }

            const bookmark = {
                id: Date.now().toString(),
                url: finalUrl,
                title: finalUrl,
                date: new Date().toISOString()
            };

            bookmarks.push(bookmark);
            saveBookmarks();
            renderBookmarks();
            urlInput.value = '';
        }

        function deleteBookmark(id) {
            bookmarks = bookmarks.filter(b => b.id !== id);
            saveBookmarks();
            renderBookmarks();
        }

        function openBookmark(url) {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('open-url-in-active-tab', url);
        }

        function saveBookmarks() {
            localStorage.setItem('xenixa_bookmarks', JSON.stringify(bookmarks));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('bookmarkUrl').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                addBookmark();
            }
        });

        loadBookmarks();
    </script>
</body>

</html>
